<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🍜 냄비모임 가입 라면 시험</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: linear-gradient(180deg, #ffd9a8 0%, #ff9466 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  button, .ramen-card, .extra-btn, .fire-btn, .bag, .kettle, .star, .pot {
    touch-action: manipulation;
    cursor: pointer;
  }
  h1 { color: #4a1f00; font-size: 24px; margin-bottom: 4px; }
  .sub { color: #6b3410; font-size: 13px; margin-bottom: 16px; }
  .game {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .stage-label {
    background: #ff6b35;
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    display: inline-block;
    margin-bottom: 12px;
  }
  .instruction {
    font-size: 15px;
    color: #333;
    margin-bottom: 16px;
    min-height: 22px;
    font-weight: 600;
  }
  .scene {
    position: relative;
    height: 280px;
    background: linear-gradient(180deg, #fff5e1 0%, #ffe4b8 100%);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .stove {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 24px;
    background: #2a2a2a;
    border-radius: 6px;
  }
  .flame {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 36px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .flame.on { opacity: 1; animation: flick 0.3s infinite alternate; }
  .flame.mid { font-size: 28px; }
  .flame.low { font-size: 20px; }
  @keyframes flick {
    0% { transform: translateX(-50%) scale(1); }
    100% { transform: translateX(-50%) scale(1.15) translateY(-3px); }
  }
  .pot {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 130px;
    background: linear-gradient(180deg, #999 0%, #555 100%);
    border-radius: 0 0 24px 24px;
    border: 3px solid #222;
    border-top: none;
    overflow: hidden;
    cursor: pointer;
  }
  .pot::before, .pot::after {
    content: '';
    position: absolute;
    top: -6px;
    width: 24px;
    height: 10px;
    background: #222;
    border-radius: 5px;
  }
  .pot::before { left: -22px; }
  .pot::after { right: -22px; }
  .water {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: linear-gradient(180deg, rgba(255,220,140,0.85) 0%, rgba(255,150,60,0.95) 100%);
    transition: height 0.3s;
    height: 0%;
  }
  .water.boiling {
    background: linear-gradient(180deg, rgba(255,180,80,0.9) 0%, rgba(255,100,40,1) 100%);
  }
  .water.boiling::after {
    content: '○ ° ○ ° ○';
    position: absolute;
    top: 2px;
    left: 0;
    right: 0;
    text-align: center;
    color: #fff;
    font-size: 14px;
    animation: bubble 0.4s infinite;
  }
  @keyframes bubble {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
  .ingredients-in-pot {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px;
    font-size: 22px;
    padding: 0 20px;
  }
  .kettle {
    position: absolute;
    top: 30px;
    left: 30px;
    font-size: 64px;
    cursor: pointer;
    transition: transform 0.4s;
    filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2));
  }
  .kettle:hover { transform: scale(1.05); }
  .kettle.pouring {
    transform: translate(120px, 30px) rotate(70deg);
  }
  .water-stream {
    position: absolute;
    top: 80px;
    left: 180px;
    width: 4px;
    height: 60px;
    background: linear-gradient(180deg, rgba(150,200,255,0) 0%, rgba(100,180,255,0.9) 100%);
    opacity: 0;
    border-radius: 2px;
  }
  .water-stream.flowing { opacity: 1; }
  .ramen-choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .ramen-card {
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fff;
    font-size: 13px;
  }
  .ramen-card:hover { border-color: #ff6b35; transform: translateY(-2px); }
  .ramen-card.selected { border-color: #ff6b35; background: #fff4ed; }
  .ramen-card .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
  .ramen-card .name { font-weight: 700; color: #333; }
  .ramen-card .desc { color: #888; font-size: 11px; margin-top: 2px; }
  .bag-area {
    text-align: center;
    margin-bottom: 12px;
  }
  .bag {
    display: inline-block;
    font-size: 100px;
    cursor: pointer;
    transition: transform 0.05s;
    position: relative;
    padding: 20px 40px;
    user-select: none;
    -webkit-user-select: none;
  }
  .bag:active { transform: scale(0.92); }
  .tear-bar {
    width: 80%;
    height: 10px;
    background: #eee;
    border-radius: 5px;
    margin: 8px auto;
    overflow: hidden;
  }
  .tear-fill {
    height: 100%;
    background: linear-gradient(90deg, #4dabf7, #ff6b35);
    width: 0%;
    transition: width 0.1s;
  }
  .extras {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .extra-btn {
    padding: 12px 6px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    text-align: center;
    font-size: 12px;
    transition: all 0.2s;
  }
  .extra-btn .emoji { font-size: 24px; display: block; margin-bottom: 2px; }
  .extra-btn:hover { border-color: #ff6b35; }
  .extra-btn.added { border-color: #51cf66; background: #ebfbee; }
  .extra-btn.added::after { content: ' ✓'; color: #51cf66; font-weight: 700; }
  .fire-control {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .fire-btn {
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .fire-btn:hover { border-color: #ff6b35; }
  .fire-btn.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }
  .actions {
    display: flex;
    gap: 8px;
  }
  button.main {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #ff6b35;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button.main:hover:not(:disabled) { transform: translateY(-2px); }
  button.main:disabled { opacity: 0.4; cursor: not-allowed; }
  button.ghost {
    padding: 14px 16px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .temp-display {
    text-align: center;
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }
  .temp-bar {
    height: 14px;
    background: #eee;
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 14px;
    position: relative;
  }
  .temp-fill {
    height: 100%;
    background: linear-gradient(90deg, #4dabf7 0%, #ffd43b 60%, #ff6b6b 100%);
    width: 0%;
    transition: width 0.2s;
  }
  .temp-bar::after {
    content: '';
    position: absolute;
    left: 80%;
    top: -4px;
    width: 2px;
    height: 22px;
    background: #333;
  }
  .result {
    text-align: center;
    padding: 16px;
    border-radius: 12px;
    margin-top: 12px;
    font-weight: 700;
  }
  .result.pass { background: #d3f9d8; color: #2b8a3e; }
  .result.fail { background: #ffe3e3; color: #c92a2a; }
  .result .grade { font-size: 28px; margin-bottom: 6px; }
  .result .detail { font-size: 13px; font-weight: 400; line-height: 1.5; margin-top: 8px; }
  .members-panel {
    margin-top: 14px;
    padding: 14px;
    background: #fffbf2;
    border-radius: 12px;
    border: 2px dashed #ffb88c;
  }
  .members-panel-title {
    font-size: 14px;
    font-weight: 700;
    color: #5a2d0c;
    margin-bottom: 10px;
    text-align: center;
  }
  .member-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px dashed #ffd9b8;
    text-align: left;
  }
  .member-row:last-child { border-bottom: none; }
  .member-avatar { font-size: 32px; line-height: 1; flex-shrink: 0; }
  .member-info { flex: 1; }
  .member-name { font-weight: 700; font-size: 13px; color: #333; }
  .member-stars { color: #ffd43b; font-size: 13px; margin-left: 4px; }
  .member-comment { font-size: 12px; color: #555; margin-top: 2px; line-height: 1.4; }
  .member-vote {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .vote-yes { background: #d3f9d8; color: #2b8a3e; }
  .vote-no { background: #ffe3e3; color: #c92a2a; }
  .final-verdict {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
  }
  .verdict-pass { background: #d3f9d8; color: #2b8a3e; }
  .verdict-fail { background: #ffe3e3; color: #c92a2a; }
  .share-panel {
    margin-top: 14px;
    padding: 14px;
    background: #f1f3f5;
    border-radius: 12px;
  }
  .share-title {
    font-size: 13px;
    font-weight: 700;
    color: #495057;
    margin-bottom: 10px;
  }
  .share-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .share-btn {
    padding: 10px;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: #339af0;
    color: #fff;
  }
  .share-btn.text { background: #51cf66; }
  .share-btn.copied { background: #495057; }
  .nickname-input {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .team-eval-panel {
    margin-top: 14px;
    padding: 14px;
    background: #fff4ed;
    border-radius: 12px;
    border: 2px dashed #ff8c42;
  }
  .team-eval-title {
    font-size: 14px;
    font-weight: 700;
    color: #5a2d0c;
    margin-bottom: 10px;
    text-align: center;
  }
  .star-picker {
    text-align: center;
    font-size: 32px;
    margin: 8px 0;
    cursor: pointer;
  }
  .star-picker .star {
    color: #ddd;
    transition: color 0.1s;
    padding: 0 2px;
  }
  .star-picker .star.active { color: #ffd43b; }
  .team-comment-input {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 8px;
    font-family: inherit;
    resize: vertical;
    min-height: 50px;
  }
  .external-eval {
    background: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 6px;
    border-left: 4px solid #ff8c42;
    font-size: 13px;
  }
  .external-eval-head {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .external-eval-name { font-weight: 700; color: #5a2d0c; }
  .external-eval-stars { color: #ffd43b; }
  .external-eval-comment { color: #555; font-size: 12px; }
  .read-only-banner {
    background: #fff3bf;
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    color: #5a2d0c;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>🍜 냄비모임 가입 라면 시험</h1>
  <div class="sub">잘 끓이면 정회원, 망치면 다음 기수 ㅋㅋ</div>

  <div class="game">
    <div class="stage-label" id="stageLabel">STAGE 1 / 6</div>
    <div class="instruction" id="instruction">주전자를 클릭해서 냄비에 물을 부어주세요</div>

    <div class="scene">
      <div class="kettle" id="kettle">🫖</div>
      <div class="water-stream" id="stream"></div>
      <div class="flame" id="flame">🔥</div>
      <div class="pot" id="pot">
        <div class="water" id="water"></div>
        <div class="ingredients-in-pot" id="potIngredients"></div>
      </div>
      <div class="stove"></div>
    </div>

    <div class="temp-display" id="tempDisplay"></div>
    <div class="temp-bar"><div class="temp-fill" id="tempFill"></div></div>

    <!-- Stage 2: Ramen selection -->
    <div id="ramenStage" class="hidden">
      <div class="ramen-choices">
        <div class="ramen-card" data-ramen="신라면">
          <span class="emoji">🌶️</span>
          <div class="name">신라면</div>
          <div class="desc">매콤 클래식</div>
        </div>
        <div class="ramen-card" data-ramen="진라면">
          <span class="emoji">🍜</span>
          <div class="name">진라면</div>
          <div class="desc">순한맛/매운맛</div>
        </div>
        <div class="ramen-card" data-ramen="안성탕면">
          <span class="emoji">🥘</span>
          <div class="name">안성탕면</div>
          <div class="desc">진한 소고기</div>
        </div>
        <div class="ramen-card" data-ramen="너구리">
          <span class="emoji">🦝</span>
          <div class="name">너구리</div>
          <div class="desc">쫄깃 우동면</div>
        </div>
      </div>
    </div>

    <!-- Stage 3: Tear bag -->
    <div id="bagStage" class="hidden bag-area">
      <div class="bag" id="bag">📦</div>
      <div class="tear-bar"><div class="tear-fill" id="tearFill"></div></div>
      <div style="font-size: 12px; color: #888;">봉지를 빠르게 탭해서 뜯으세요 (6번)</div>
    </div>

    <!-- Stage 4: Extras -->
    <div id="extrasStage" class="hidden">
      <div class="extras">
        <div class="extra-btn" data-extra="청양고추"><span class="emoji">🌶️</span>청양고추</div>
        <div class="extra-btn" data-extra="콩나물"><span class="emoji">🌱</span>콩나물</div>
        <div class="extra-btn" data-extra="계란"><span class="emoji">🥚</span>계란</div>
        <div class="extra-btn" data-extra="대파"><span class="emoji">🧅</span>대파</div>
        <div class="extra-btn" data-extra="치즈"><span class="emoji">🧀</span>치즈</div>
        <div class="extra-btn" data-extra="떡"><span class="emoji">🍡</span>떡</div>
      </div>
    </div>

    <!-- Stage 5: Fire control -->
    <div id="fireStage" class="hidden">
      <div class="fire-control">
        <div class="fire-btn" data-fire="low">🔥 약불</div>
        <div class="fire-btn" data-fire="mid">🔥🔥 중불</div>
        <div class="fire-btn" data-fire="high">🔥🔥🔥 강불</div>
      </div>
    </div>

    <div class="actions">
      <button class="main" id="nextBtn">시작!</button>
      <button class="ghost" id="resetBtn">🔄</button>
    </div>

    <div id="result"></div>
  </div>

<script>
const state = {
  stage: 1,
  water: 0,
  pouring: false,
  ramen: null,
  tearCount: 0,
  noodleIn: false,
  soupIn: false,
  extras: [],
  fire: null,
  temp: 0,
  tempInterval: null,
  cookStart: null,
  cookTime: 0,
  done: false,
  nickname: '',
  externalEvals: [],
  readOnly: false,
};

const $ = id => document.getElementById(id);

function setStage(n) {
  state.stage = n;
  $('stageLabel').textContent = `STAGE ${n} / 6`;
  // hide all stage panels
  ['ramenStage','bagStage','extrasStage','fireStage'].forEach(id => $(id).classList.add('hidden'));
  $('nextBtn').disabled = false;

  if (n === 1) {
    $('instruction').textContent = '주전자를 클릭해서 냄비에 물을 부어주세요 (꾹 누르기)';
    $('nextBtn').textContent = '물 충분히 부었어요 →';
    $('nextBtn').disabled = state.water < 50;
  } else if (n === 2) {
    $('instruction').textContent = '오늘의 라면을 골라주세요';
    $('ramenStage').classList.remove('hidden');
    $('nextBtn').textContent = '이걸로 결정 →';
    $('nextBtn').disabled = !state.ramen;
  } else if (n === 3) {
    $('instruction').textContent = `${state.ramen} 봉지를 뜯어 면과 스프를 냄비에 넣으세요`;
    $('bagStage').classList.remove('hidden');
    $('nextBtn').textContent = '면과 스프 다 넣음 →';
    $('nextBtn').disabled = !(state.noodleIn && state.soupIn);
  } else if (n === 4) {
    $('instruction').textContent = '취향껏 부가 재료를 추가하세요 (선택)';
    $('extrasStage').classList.remove('hidden');
    $('nextBtn').textContent = '재료 추가 완료 →';
    $('nextBtn').disabled = false;
  } else if (n === 5) {
    $('instruction').textContent = '불 세기를 정하세요. 너무 약하면 안 끓고, 너무 세면 넘쳐요';
    $('fireStage').classList.remove('hidden');
    $('nextBtn').textContent = '끓이기 시작 →';
    $('nextBtn').disabled = !state.fire;
  } else if (n === 6) {
    $('instruction').textContent = '파바박 끓을 때까지! 적당히 익으면 완성 버튼';
    $('nextBtn').textContent = '🥢 완성!';
    $('nextBtn').disabled = false;
    startCooking();
  }
}

function updateTemp() {
  $('tempFill').style.width = state.temp + '%';
  const water = $('water');
  if (state.temp >= 80) {
    water.classList.add('boiling');
    $('tempDisplay').textContent = `🔥 파바박 끓는중! ${Math.floor(state.temp)}°C`;
  } else if (state.temp >= 50) {
    water.classList.remove('boiling');
    $('tempDisplay').textContent = `데워지는 중 ${Math.floor(state.temp)}°C`;
  } else {
    water.classList.remove('boiling');
    $('tempDisplay').textContent = state.fire ? `미지근 ${Math.floor(state.temp)}°C` : '';
  }
}

// Stage 1: Pour water
let pourTimer = null;
$('kettle').addEventListener('touchstart', e => { e.preventDefault(); startPour(); }, { passive: false });
$('kettle').addEventListener('mousedown', startPour);
document.addEventListener('touchend', stopPour);
document.addEventListener('touchcancel', stopPour);
document.addEventListener('mouseup', stopPour);

function startPour() {
  if (state.stage !== 1 || state.water >= 100) return;
  state.pouring = true;
  $('kettle').classList.add('pouring');
  $('stream').classList.add('flowing');
  pourTimer = setInterval(() => {
    state.water = Math.min(100, state.water + 3);
    $('water').style.height = (state.water * 0.7) + '%';
    if (state.water >= 50) $('nextBtn').disabled = false;
    if (state.water >= 100) stopPour();
  }, 80);
}
function stopPour() {
  if (!state.pouring) return;
  state.pouring = false;
  $('kettle').classList.remove('pouring');
  $('stream').classList.remove('flowing');
  clearInterval(pourTimer);
}

function tapHandler(el, fn) {
  let touched = false;
  el.addEventListener('touchstart', e => {
    touched = true;
    e.preventDefault();
    fn();
  }, { passive: false });
  el.addEventListener('click', e => {
    if (touched) { touched = false; return; }
    fn();
  });
}

// Stage 2: Ramen selection
document.querySelectorAll('.ramen-card').forEach(card => {
  tapHandler(card, () => {
    if (state.stage !== 2) return;
    document.querySelectorAll('.ramen-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    state.ramen = card.dataset.ramen;
    $('nextBtn').disabled = false;
  });
});

// Stage 3: Tear bag, then put noodle & soup
const TEAR_TARGET = 6;
tapHandler($('bag'), () => {
  if (state.stage !== 3) return;
  if (state.tearCount < TEAR_TARGET) {
    state.tearCount++;
    $('tearFill').style.width = (state.tearCount / TEAR_TARGET * 100) + '%';
    if (state.tearCount >= TEAR_TARGET) {
      $('bag').textContent = '💥';
      $('instruction').textContent = '봉지가 뜯어졌어요! 한 번 더 탭 → 면 투입';
    }
  } else if (!state.noodleIn) {
    state.noodleIn = true;
    $('potIngredients').innerHTML += '🍜';
    $('bag').textContent = '📜';
    $('instruction').textContent = '면 투입 완료! 스프 봉지 한 번 더 탭';
  } else if (!state.soupIn) {
    state.soupIn = true;
    $('potIngredients').innerHTML += '🌶️';
    $('bag').textContent = '✅';
    $('instruction').textContent = '면+스프 투입 완료. 다음 단계로!';
    $('nextBtn').disabled = false;
  }
});

// Stage 4: Extras
document.querySelectorAll('.extra-btn').forEach(btn => {
  tapHandler(btn, () => {
    if (state.stage !== 4) return;
    const name = btn.dataset.extra;
    const emojiMap = {청양고추:'🌶️',콩나물:'🌱',계란:'🥚',대파:'🧅',치즈:'🧀',떡:'🍡'};
    if (state.extras.includes(name)) {
      state.extras = state.extras.filter(e => e !== name);
      btn.classList.remove('added');
      $('potIngredients').innerHTML = $('potIngredients').innerHTML.replace(emojiMap[name], '');
    } else {
      state.extras.push(name);
      btn.classList.add('added');
      $('potIngredients').innerHTML += emojiMap[name];
    }
  });
});

// Stage 5: Fire
document.querySelectorAll('.fire-btn').forEach(btn => {
  tapHandler(btn, () => {
    if (state.stage !== 5) return;
    document.querySelectorAll('.fire-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.fire = btn.dataset.fire;
    $('nextBtn').disabled = false;
  });
});

// Stage 6: Cooking
function startCooking() {
  $('flame').classList.add('on');
  $('flame').classList.remove('low','mid');
  if (state.fire === 'low') $('flame').classList.add('low');
  else if (state.fire === 'mid') $('flame').classList.add('mid');

  const speed = state.fire === 'high' ? 3 : state.fire === 'mid' ? 1.8 : 0.9;
  state.cookStart = Date.now();
  state.tempInterval = setInterval(() => {
    if (state.done) return;
    state.temp = Math.min(110, state.temp + speed);
    updateTemp();
    if (state.temp >= 105) {
      // overflow
      $('instruction').textContent = '⚠️ 넘친다! 빨리 완성 누르거나 망함!';
    }
  }, 200);
}

// Next button progression
$('nextBtn').addEventListener('click', () => {
  if (state.stage < 6) {
    setStage(state.stage + 1);
  } else {
    finishCooking();
  }
});

function finishCooking() {
  state.done = true;
  state.cookTime = (Date.now() - state.cookStart) / 1000;
  clearInterval(state.tempInterval);
  $('flame').classList.remove('on');

  let score = 0;
  const reasons = [];

  // 물 양
  if (state.water >= 70 && state.water <= 90) { score += 15; reasons.push('물 양 적당 +15'); }
  else if (state.water >= 50) { score += 8; reasons.push('물 양 ok +8'); }
  else { reasons.push('물이 너무 적음 +0'); }

  // 끓는 상태
  if (state.temp >= 90 && state.temp <= 100) { score += 30; reasons.push('파바박 펄펄 +30'); }
  else if (state.temp >= 80) { score += 20; reasons.push('잘 끓음 +20'); }
  else if (state.temp >= 60) { score += 8; reasons.push('덜 끓음 +8'); }
  else { reasons.push('생라면... +0'); }

  // 넘침 페널티
  if (state.temp > 102) { score -= 15; reasons.push('넘침 -15'); }

  // 끓인 시간
  if (state.cookTime >= 4 && state.cookTime <= 9) { score += 25; reasons.push('타이밍 황금 +25'); }
  else if (state.cookTime < 4) { score += 5; reasons.push('덜 익음 +5'); }
  else { score += 10; reasons.push('퍼짐 +10'); }

  // 부가 재료 보너스
  if (state.extras.length > 0) {
    const bonus = Math.min(20, state.extras.length * 5);
    score += bonus;
    reasons.push(`재료 ${state.extras.length}종 +${bonus}`);
  }
  if (state.extras.includes('계란')) { score += 5; reasons.push('계란 황금토핑 +5'); }

  // 불 세기 매칭
  if (state.fire === 'high' && state.cookTime < 6) { score += 5; reasons.push('강불 속도전 +5'); }
  if (state.fire === 'low' && state.temp < 80) { score -= 10; reasons.push('약불 망함 -10'); }

  const pass = score >= 70;
  let grade;
  if (score >= 110) grade = '🏆 마스터 셰프';
  else if (score >= 90) grade = '🥇 정회원 합격';
  else if (score >= 70) grade = '🥈 간신히 합격';
  else if (score >= 50) grade = '😅 다음 기수 도전';
  else grade = '💀 라면 학원부터';

  const msg = pass
    ? `🎉 ${state.ramen} 완성! 냄비모임 가입 승인!`
    : `😭 라면을 망쳤어요... 가입 보류`;

  renderResult(score, grade, msg, pass, reasons);
  $('nextBtn').disabled = true;
}

function renderResult(score, grade, msg, pass, reasons) {
  // 모임원 평가
  const evaluations = evaluateByMembers();
  const yesVotes = evaluations.filter(e => e.vote).length;
  const externalYes = state.externalEvals.filter(e => e.stars >= 3).length;
  const totalYes = yesVotes + externalYes;
  const totalCount = 5 + state.externalEvals.length;
  const finalPass = totalYes >= Math.ceil(totalCount / 2) + (totalCount === 5 ? 0 : 0) && totalYes >= 3;

  const membersHtml = `
    <div class="members-panel">
      <div class="members-panel-title">👥 냄비모임 5인 평가단</div>
      ${evaluations.map(e => `
        <div class="member-row">
          <div class="member-avatar">${e.avatar}</div>
          <div class="member-info">
            <div>
              <span class="member-name">${e.name}</span>
              <span class="member-stars">${'★'.repeat(e.stars)}${'☆'.repeat(5 - e.stars)}</span>
            </div>
            <div class="member-comment">"${e.comment}"</div>
          </div>
          <div class="member-vote ${e.vote ? 'vote-yes' : 'vote-no'}">
            ${e.vote ? '찬성' : '반대'}
          </div>
        </div>
      `).join('')}
    </div>
  `;

  const externalEvalsHtml = state.externalEvals.length > 0 ? `
    <div class="members-panel">
      <div class="members-panel-title">💬 추가 평가 (${state.externalEvals.length}명)</div>
      ${state.externalEvals.map(e => `
        <div class="external-eval">
          <div class="external-eval-head">
            <span class="external-eval-name">${escapeHtml(e.name)}</span>
            <span class="external-eval-stars">${'★'.repeat(e.stars)}${'☆'.repeat(5 - e.stars)}</span>
          </div>
          <div class="external-eval-comment">"${escapeHtml(e.comment) || '평가 코멘트 없음'}"</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const verdictHtml = `
    <div class="final-verdict ${finalPass ? 'verdict-pass' : 'verdict-fail'}">
      ${finalPass
        ? `🎊 ${totalYes}/${totalCount} 찬성 — 정식 입회 통과!`
        : `💔 ${totalYes}/${totalCount} 찬성 — 더 많은 찬성표 필요`}
    </div>
  `;

  const banner = state.readOnly
    ? `<div class="read-only-banner">📨 ${escapeHtml(state.nickname || '누군가')}의 라면 결과를 보고 있어요. 아래에서 평가해주세요!</div>`
    : '';

  const shareHtml = !state.readOnly ? `
    <div class="share-panel">
      <div class="share-title">📤 결과 공유하기 (팀원이 평가할 수 있어요)</div>
      <input type="text" id="nicknameInput" class="nickname-input" placeholder="내 닉네임 (예: 서현)" value="${escapeHtml(state.nickname)}">
      <div class="share-buttons">
        <button class="share-btn" id="shareUrlBtn">🔗 결과 링크 복사</button>
        <button class="share-btn text" id="shareTextBtn">💬 슬랙/카톡용 텍스트 복사</button>
      </div>
      <div style="font-size:11px; color:#868e96; text-align:center; line-height:1.5;">
        링크를 받은 팀원이 별점을 추가하면 새 링크가 생성돼요
      </div>
    </div>
  ` : '';

  const teamEvalHtml = state.readOnly ? `
    <div class="team-eval-panel">
      <div class="team-eval-title">⭐ 이 라면에 별점을 매겨주세요</div>
      <input type="text" id="evalName" class="nickname-input" placeholder="내 이름">
      <div class="star-picker" id="starPicker">
        ${[1,2,3,4,5].map(n => `<span class="star" data-star="${n}">★</span>`).join('')}
      </div>
      <textarea id="evalComment" class="team-comment-input" placeholder="한 마디 코멘트 (선택)"></textarea>
      <button class="main" id="submitEvalBtn" style="width:100%;">내 평가 제출하고 링크 만들기</button>
    </div>
  ` : '';

  $('result').className = 'result ' + (pass ? 'pass' : 'fail');
  $('result').innerHTML = `
    ${banner}
    <div class="grade">${grade}</div>
    <div>${msg}</div>
    <div>총점 ${score}점 · ${state.cookTime.toFixed(1)}초 끓임</div>
    <div class="detail">${reasons.join(' / ')}</div>
    <div class="detail" style="margin-top:8px;">추가 재료: ${state.extras.length ? state.extras.join(', ') : '없음'}</div>
    ${membersHtml}
    ${externalEvalsHtml}
    ${verdictHtml}
    ${shareHtml}
    ${teamEvalHtml}
  `;

  attachShareHandlers(score, evaluations);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function attachShareHandlers(score, evaluations) {
  if (!state.readOnly) {
    const nickInput = $('nicknameInput');
    if (nickInput) {
      nickInput.addEventListener('input', e => { state.nickname = e.target.value; });
    }
    const urlBtn = $('shareUrlBtn');
    if (urlBtn) {
      urlBtn.addEventListener('click', async () => {
        const url = buildShareUrl();
        try {
          await navigator.clipboard.writeText(url);
          urlBtn.textContent = '✓ 링크 복사됨!';
          urlBtn.classList.add('copied');
          setTimeout(() => {
            urlBtn.textContent = '🔗 결과 링크 복사';
            urlBtn.classList.remove('copied');
          }, 2000);
        } catch (e) {
          prompt('아래 링크 복사해서 공유하세요:', url);
        }
      });
    }
    const txtBtn = $('shareTextBtn');
    if (txtBtn) {
      txtBtn.addEventListener('click', async () => {
        const text = buildShareText(score, evaluations);
        try {
          await navigator.clipboard.writeText(text);
          txtBtn.textContent = '✓ 텍스트 복사됨!';
          txtBtn.classList.add('copied');
          setTimeout(() => {
            txtBtn.textContent = '💬 슬랙/카톡용 텍스트 복사';
            txtBtn.classList.remove('copied');
          }, 2000);
        } catch (e) {
          prompt('아래 텍스트 복사해서 공유하세요:', text);
        }
      });
    }
  } else {
    // team eval handlers
    let selectedStars = 0;
    document.querySelectorAll('#starPicker .star').forEach(starEl => {
      starEl.addEventListener('click', () => {
        selectedStars = parseInt(starEl.dataset.star);
        document.querySelectorAll('#starPicker .star').forEach((s, i) => {
          s.classList.toggle('active', i < selectedStars);
        });
      });
    });
    $('submitEvalBtn').addEventListener('click', () => {
      const name = ($('evalName').value || '').trim();
      const comment = ($('evalComment').value || '').trim();
      if (!name) { alert('이름을 입력해주세요'); return; }
      if (!selectedStars) { alert('별점을 골라주세요'); return; }
      state.externalEvals.push({ name, stars: selectedStars, comment });
      const newUrl = buildShareUrl();
      try {
        navigator.clipboard.writeText(newUrl);
        alert('평가 추가됨! 새 링크가 클립보드에 복사됐어요. 다음 팀원에게 공유하세요.');
      } catch (e) {
        prompt('새 링크 복사해서 다음 팀원에게 공유하세요:', newUrl);
      }
      // re-render
      const result = recalcScore();
      renderResult(result.score, result.grade, result.msg, result.pass, result.reasons);
    });
  }
}

function buildShareUrl() {
  const data = {
    n: state.nickname,
    w: Math.round(state.water),
    r: state.ramen,
    e: state.extras,
    t: Math.round(state.temp),
    ct: Math.round(state.cookTime * 10) / 10,
    f: state.fire,
    ev: state.externalEvals,
  };
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  const base = location.href.split('?')[0].split('#')[0];
  return `${base}?r=${encoded}`;
}

function buildShareText(score, evaluations) {
  const nick = state.nickname || '익명';
  const lines = [
    `🍜 ${nick}의 냄비모임 가입 라면 시험 결과`,
    '━━━━━━━━━━━━━━',
    `🥢 라면: ${state.ramen}`,
    `💧 물: ${Math.round(state.water)}%`,
    `🔥 화력: ${({low:'약불',mid:'중불',high:'강불'})[state.fire]}`,
    `⏱️ 끓인 시간: ${state.cookTime.toFixed(1)}초`,
    `🌡️ 최종 온도: ${Math.round(state.temp)}°C`,
    `🥗 재료: ${state.extras.length ? state.extras.join(', ') : '기본'}`,
    '',
    `📊 총점: ${score}점`,
    '━━━━━━━━━━━━━━',
    '👥 5인 평가단',
    ...evaluations.map(e => `${e.avatar} ${e.name} ${'★'.repeat(e.stars)}${'☆'.repeat(5-e.stars)} "${e.comment}"`),
    '',
    `너도 평가해줘 👉 ${buildShareUrl()}`,
  ];
  return lines.join('\n');
}

function recalcScore() {
  let score = 0;
  const reasons = [];
  if (state.water >= 70 && state.water <= 90) { score += 15; reasons.push('물 양 적당 +15'); }
  else if (state.water >= 50) { score += 8; reasons.push('물 양 ok +8'); }
  else { reasons.push('물이 너무 적음 +0'); }
  if (state.temp >= 90 && state.temp <= 100) { score += 30; reasons.push('파바박 펄펄 +30'); }
  else if (state.temp >= 80) { score += 20; reasons.push('잘 끓음 +20'); }
  else if (state.temp >= 60) { score += 8; reasons.push('덜 끓음 +8'); }
  else { reasons.push('생라면... +0'); }
  if (state.temp > 102) { score -= 15; reasons.push('넘침 -15'); }
  if (state.cookTime >= 4 && state.cookTime <= 9) { score += 25; reasons.push('타이밍 황금 +25'); }
  else if (state.cookTime < 4) { score += 5; reasons.push('덜 익음 +5'); }
  else { score += 10; reasons.push('퍼짐 +10'); }
  if (state.extras.length > 0) {
    const bonus = Math.min(20, state.extras.length * 5);
    score += bonus;
    reasons.push(`재료 ${state.extras.length}종 +${bonus}`);
  }
  if (state.extras.includes('계란')) { score += 5; reasons.push('계란 황금토핑 +5'); }
  if (state.fire === 'high' && state.cookTime < 6) { score += 5; reasons.push('강불 속도전 +5'); }
  if (state.fire === 'low' && state.temp < 80) { score -= 10; reasons.push('약불 망함 -10'); }
  const pass = score >= 70;
  let grade;
  if (score >= 110) grade = '🏆 마스터 셰프';
  else if (score >= 90) grade = '🥇 정회원 합격';
  else if (score >= 70) grade = '🥈 간신히 합격';
  else if (score >= 50) grade = '😅 다음 기수 도전';
  else grade = '💀 라면 학원부터';
  const msg = pass
    ? `🎉 ${state.ramen} 완성! 냄비모임 가입 승인!`
    : `😭 라면을 망쳤어요... 가입 보류`;
  return { score, grade, msg, pass, reasons };
}

function loadFromUrl() {
  const params = new URLSearchParams(location.search);
  const r = params.get('r');
  if (!r) return false;
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(r))));
    state.nickname = data.n || '';
    state.water = data.w || 0;
    state.ramen = data.r || '신라면';
    state.extras = data.e || [];
    state.temp = data.t || 0;
    state.cookTime = data.ct || 0;
    state.fire = data.f || 'mid';
    state.externalEvals = data.ev || [];
    state.done = true;
    state.readOnly = true;
    // hide game stages
    document.querySelectorAll('.scene, .temp-display, .temp-bar, .stage-label, .instruction, .actions, #ramenStage, #bagStage, #extrasStage, #fireStage').forEach(el => {
      if (el) el.classList.add('hidden');
    });
    const result = recalcScore();
    renderResult(result.score, result.grade, result.msg, result.pass, result.reasons);
    return true;
  } catch (e) {
    console.error('URL load failed', e);
    return false;
  }
}

function evaluateByMembers() {
  const ex = state.extras;
  const temp = state.temp;
  const t = state.cookTime;
  const fire = state.fire;
  const ramen = state.ramen;

  // 1. 매콤이 — 매운 거 광신도
  const spicy = (() => {
    let s = 2;
    const cs = [];
    if (ex.includes('청양고추')) { s += 2; cs.push('청양고추 들어간 거 봐 미쳤다'); }
    if (ramen === '신라면') { s += 1; cs.push('신라면이지 ㅇㅇ'); }
    if (!ex.includes('청양고추') && ramen !== '신라면') { s -= 1; cs.push('맵찔이용 라면이네...'); }
    if (ex.includes('치즈')) { s -= 1; cs.push('치즈 왜 넣음 맛 죽이지 마'); }
    s = Math.max(1, Math.min(5, s));
    return { name: '매콤이', avatar: '🌶️', stars: s, vote: s >= 3, comment: cs.join(' / ') || '평타치네' };
  })();

  // 2. 건강이 — 야채/단백질 사랑
  const healthy = (() => {
    let s = 2;
    const cs = [];
    if (ex.includes('콩나물')) { s += 1; cs.push('콩나물 굿'); }
    if (ex.includes('대파')) { s += 1; cs.push('대파 향 좋아'); }
    if (ex.includes('계란')) { s += 1; cs.push('단백질 챙겼네'); }
    if (ex.includes('치즈')) { s -= 1; cs.push('치즈는 좀...'); }
    if (ex.includes('떡')) { s -= 1; cs.push('떡 탄수폭탄 ㄴㄴ'); }
    if (ex.length === 0) { s -= 1; cs.push('야채 없이 라면만? 위장에 안 좋아'); }
    s = Math.max(1, Math.min(5, s));
    return { name: '건강이', avatar: '🥗', stars: s, vote: s >= 3, comment: cs.join(' / ') || '재료 좀 더 넣지' };
  })();

  // 3. 먹깨비 — 양 많고 토핑 풍성
  const foodie = (() => {
    let s = 2;
    const cs = [];
    if (ex.length >= 4) { s += 3; cs.push('와 풀세팅 ㅈㅋ 내 스타일'); }
    else if (ex.length >= 2) { s += 1; cs.push('재료 있네'); }
    else { s -= 1; cs.push('이거 부족해 더 넣어'); }
    if (ex.includes('치즈')) { s += 1; cs.push('치즈 굿굿'); }
    if (ex.includes('떡')) { s += 1; cs.push('떡라면 최고지'); }
    if (state.water < 60) { s -= 1; cs.push('국물 적어 ㅠㅠ'); }
    s = Math.max(1, Math.min(5, s));
    return { name: '먹깨비', avatar: '🍽️', stars: s, vote: s >= 3, comment: cs.join(' / ') };
  })();

  // 4. 미식가 — 까다로운 평론가
  const critic = (() => {
    let s = 2;
    const cs = [];
    if (temp >= 90 && temp <= 100) { s += 2; cs.push('끓는 점 완벽'); }
    else if (temp < 80) { s -= 2; cs.push('이거 덜 익었는데?'); }
    if (temp > 102) { s -= 2; cs.push('국물이 넘쳤네 망함'); }
    if (t >= 4 && t <= 8) { s += 1; cs.push('타이밍 정확'); }
    else if (t > 10) { s -= 1; cs.push('면이 퍼졌어'); }
    else if (t < 4) { s -= 1; cs.push('너무 짧아 설익음'); }
    if (fire === 'mid') { s += 1; cs.push('중불이 정석이지'); }
    s = Math.max(1, Math.min(5, s));
    return { name: '미식가', avatar: '🤓', stars: s, vote: s >= 3, comment: cs.join(' / ') || '음... 무난함' };
  })();

  // 5. 잠수러 — 빨리 끝내야 안 식음
  const ghoster = (() => {
    let s = 3;
    const cs = [];
    if (t < 6) { s += 2; cs.push('빨라서 좋다 식기 전에 먹자'); }
    else if (t > 10) { s -= 2; cs.push('너무 오래 끓여서 나 먼저 갈게...'); }
    if (fire === 'high') { s += 1; cs.push('강불 ㅇㅈ 효율적'); }
    if (fire === 'low') { s -= 1; cs.push('약불은 시간낭비'); }
    if (ex.length >= 5) { s -= 1; cs.push('재료 너무 많아 귀찮음'); }
    s = Math.max(1, Math.min(5, s));
    return { name: '잠수러', avatar: '💨', stars: s, vote: s >= 3, comment: cs.join(' / ') };
  })();

  return [spicy, healthy, foodie, critic, ghoster];
}

// Reset
$('resetBtn').addEventListener('click', () => {
  clearInterval(state.tempInterval);
  Object.assign(state, {
    stage: 1, water: 0, pouring: false, ramen: null,
    tearCount: 0, noodleIn: false, soupIn: false,
    extras: [], fire: null, temp: 0, cookStart: null, cookTime: 0, done: false,
  });
  $('water').style.height = '0%';
  $('water').classList.remove('boiling');
  $('potIngredients').innerHTML = '';
  $('flame').classList.remove('on','low','mid');
  $('bag').textContent = '📦';
  $('tearFill').style.width = '0%';
  $('tempFill').style.width = '0%';
  $('tempDisplay').textContent = '';
  $('result').innerHTML = '';
  $('result').className = '';
  document.querySelectorAll('.ramen-card').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.extra-btn').forEach(b => b.classList.remove('added'));
  document.querySelectorAll('.fire-btn').forEach(b => b.classList.remove('active'));
  setStage(1);
});

if (!loadFromUrl()) {
  setStage(1);
}
</script>
